apiVersion: v1
kind: Secret
metadata:
  name: todo-db-secret
  labels:
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/part-of: todo-app
type: Opaque
stringData:
  POSTGRES_PASSWORD: "secret"      # 실습용 값. 운영에서는 반드시 변경하세요.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todo-config
  labels:
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/part-of: todo-app
data:
  POSTGRES_HOST: "postgres"        # 아래 postgres Service 이름
  POSTGRES_USER: "postgres"
  POSTGRES_DB: "todos"
  POSTGRES_PORT: "5432"
  PORT: "3000"
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: todo-postgres-pvc
  labels:
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/component: database
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard       # Kind 기본 스토리지 클래스 (rancher.io/local-path)
  resources:
    requests:
      storage: 1Gi                 # 로컬 실습용 크기
---
apiVersion: v1
kind: Pod
metadata:
  name: postgres
  labels:
    app: postgres
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/component: database
spec:
  restartPolicy: Always
  containers:
    - name: postgres
      image: postgres:17
      imagePullPolicy: IfNotPresent
      ports:
        - containerPort: 5432
          name: postgres
      env:
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: todo-db-secret
              key: POSTGRES_PASSWORD
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: todo-config
              key: POSTGRES_DB
        - name: PGDATA                       # 볼륨 루트의 lost+found 때문에 initdb 가 실패하지 않도록 하위 폴더 사용
          value: /var/lib/postgresql/data/pgdata
      volumeMounts:
        - name: postgres-data
          mountPath: /var/lib/postgresql/data
      resources:
        requests:
          cpu: "100m"
          memory: "256Mi"
        limits:
          cpu: "500m"
          memory: "1Gi"
      readinessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres", "-d", "todos"]
        initialDelaySeconds: 10
        periodSeconds: 5
        timeoutSeconds: 3
      livenessProbe:
        exec:
          command: ["pg_isready", "-U", "postgres", "-d", "todos"]
        initialDelaySeconds: 30
        periodSeconds: 10
        timeoutSeconds: 3
  volumes:
    - name: postgres-data
      persistentVolumeClaim:
        claimName: todo-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/component: database
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
      name: postgres
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-backend
  labels:
    app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
    app.kubernetes.io/component: backend
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: todo-backend
  template:
    metadata:
      labels:
        app: todo-backend
        app.kubernetes.io/name: getting-started-todo-app-fastapi-claude
        app.kubernetes.io/component: backend
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.38
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Waiting for PostgreSQL service at postgres:5432..."
              until nc -z -v -w3 postgres 5432; do
                echo "PostgreSQL is not ready yet, sleeping 2s..."
                sleep 2
              done
              echo "PostgreSQL is available!"
      # (선택) GitHub 패키지가 Private인 경우 아래 주석을 해제하고 kubectl create secret docker-registry ghcr-secret ... 실행
      # imagePullSecrets:
      #   - name: ghcr-secret
      containers:
        - name: backend
          image: ghcr.io/cstpeace0191/todo-lab-ai:prod
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: todo-config
            - secretRef:
                name: todo-db-secret
          env:
            # (선택) AI 분류용 키. 없으면 AI 분류 없이 일반 Todo 앱으로 동작합니다.
            # kubectl create secret generic todo-ai-secret --from-literal=ANTHROPIC_API_KEY=sk-ant-...
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: todo-ai-secret
                  key: ANTHROPIC_API_KEY
                  optional: true
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "512Mi"
          readinessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /api/items
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
