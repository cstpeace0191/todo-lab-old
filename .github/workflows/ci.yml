name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    env:
      SQLITE_DB_LOCATION: /tmp/todo-test.db   # 기본값 /etc/todos 는 러너에서 쓰기 불가
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check . --output-format=github
      - name: Test (pytest + coverage)
        run: >-
          pytest -q --cov=src --cov-report=term-missing
          --cov-report=xml --cov-fail-under=80 --junitxml=junit.xml
      - name: Coverage summary
        if: always()
        run: |
          {
            echo "### Backend coverage"
            echo '```'
            python -m coverage report --format=text
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: backend-test-report
          path: |
            backend/coverage.xml
            backend/junit.xml

  client:
    name: client (eslint + tsc + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: client
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run format-check
      - run: npm run build

  docker:
    name: docker (multi-stage build)
    needs: [backend, client]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v4
      - name: Build final image (test 단계의 pytest 포함)
        uses: docker/build-push-action@v7
        with:
          context: .
          target: final
          push: false
          load: true
          tags: todo-app:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test
        run: |
          docker run -d --name todo -p 3000:3000 todo-app:ci
          for i in $(seq 1 20); do
            curl -fsS http://localhost:3000/api/greeting && exit 0
            sleep 1
          done
          docker logs todo; exit 1
