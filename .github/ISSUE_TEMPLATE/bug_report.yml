name: 버그 신고
description: 재현 가능한 오류를 신고합니다
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: textarea
    id: steps
    attributes:
      label: 재현 절차
      description: 명령어·요청을 순서대로 적어 주세요
      placeholder: |
        1. docker build --target final .
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 기대 결과와 실제 결과
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: 영역
      options: [backend, client, docker, ci]
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 로그
      render: shell
